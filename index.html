<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#0F1B32;
    --paper:#FAF7F0;
    --paper-raised:#FFFFFF;
    --ink:#20242C;
    --ink-soft:#5B6472;
    --brick:#B23A2E;
    --gold:#C9A227;
    --line:#E3DED2;
    --shadow:0 10px 28px -16px rgba(15,27,50,0.28);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --paper:#12151C; --paper-raised:#1B2029; --ink:#EDEFF3; --ink-soft:#9BA3B2; --line:#2B3140;
      --shadow:0 10px 28px -16px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12151C; --paper-raised:#1B2029; --ink:#EDEFF3; --ink-soft:#9BA3B2; --line:#2B3140;
    --shadow:0 10px 28px -16px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:0 0 70px;}

  /* ---- Ribbon header, homage to M-W's navy masthead ---- */
  .ribbon{ background:var(--navy); color:#fff; padding:18px 20px 16px; }
  .ribbon .est{ font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; opacity:0.65; margin:0 0 4px; }
  .ribbon .row{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .ribbon h1{ font-family:'Lora',serif; font-weight:700; font-size:1.5rem; margin:0; letter-spacing:-0.01em; }
  .ribbon .streak{ background:rgba(255,255,255,0.12); border-radius:999px; padding:6px 12px; font-size:0.78rem; font-weight:700; white-space:nowrap; }
  .ribbon .sub{ font-size:0.8rem; opacity:0.75; margin:4px 0 0; }

  nav.tabs{ display:flex; background:var(--paper-raised); border-bottom:1px solid var(--line); }
  nav.tabs button{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.84rem;
    padding:13px 8px; cursor:pointer; border-bottom:3px solid transparent;
  }
  nav.tabs button.active{ color:var(--navy); border-bottom-color:var(--brick); }
  :root[data-theme="dark"] nav.tabs button.active{ color:#fff; }

  .content{ padding:20px; }
  .view{ display:none; }
  .view.active{ display:block; }

  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:22px; margin-bottom:16px;
  }
  .eyebrow{ color:var(--ink-soft); font-size:0.76rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 6px; }

  .thread-progress{ display:flex; gap:6px; margin-bottom:16px; }
  .thread-progress .dot{ flex:1; height:5px; border-radius:99px; background:var(--line); }
  .thread-progress .dot.done{ background:var(--gold); }
  .thread-progress .dot.current{ background:var(--brick); }

  .headword{ font-family:'Lora',serif; font-weight:700; font-size:1.9rem; margin:0 0 4px; }
  .thread-tag{ display:inline-block; font-size:0.72rem; font-weight:800; color:var(--navy); background:#EDE7D9; padding:3px 10px; border-radius:99px; margin-bottom:14px; }
  :root[data-theme="dark"] .thread-tag{ color:#12151C; }

  a.mw-link{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--navy); color:#fff; text-decoration:none;
    font-weight:700; font-size:0.88rem; padding:11px 16px; border-radius:10px;
    margin:6px 0 20px;
  }
  a.mw-link:hover{ background:var(--navy-deep); }

  .step-label{ font-family:'Inter',sans-serif; font-weight:800; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:18px 0 8px; }
  .step-label:first-of-type{ margin-top:0; }

  input[type="text"]{
    width:100%; font-family:'Inter',sans-serif; font-size:0.95rem; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px;
  }
  input[type="text"]:focus{ outline:2px solid var(--brick); outline-offset:1px; }

  .file-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  label.upload-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1.5px dashed var(--line);
    color:var(--ink); font-weight:700; font-size:0.86rem; padding:10px 14px; border-radius:10px; cursor:pointer;
  }
  label.upload-btn:hover{ border-color:var(--brick); }
  input[type="file"]{ display:none; }
  .thumb{ width:56px; height:56px; border-radius:8px; object-fit:cover; border:1px solid var(--line); }
  .file-ok{ font-size:0.8rem; color:var(--ink-soft); }

  .rec-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button.rec{
    background:var(--brick); color:#fff; border:none; font-weight:800; font-size:0.84rem;
    padding:10px 16px; border-radius:10px; cursor:pointer;
  }
  button.rec.stop{ background:var(--ink); }
  audio{ height:34px; max-width:200px; }

  .standout-row{ display:flex; gap:8px; align-items:center; }
  .standout-row input{ flex:1; }
  button.surprise{
    background:var(--gold); color:var(--navy-deep); border:none; font-weight:800; font-size:0.8rem;
    padding:11px 13px; border-radius:10px; cursor:pointer; white-space:nowrap;
  }

  .step-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; }
  button.primary{
    background:var(--navy); color:#fff; border:none; font-family:'Inter',sans-serif; font-weight:800;
    font-size:0.9rem; padding:12px 20px; border-radius:10px; cursor:pointer;
  }
  button.primary:hover{ background:var(--navy-deep); }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }
  button.ghost{
    background:transparent; border:1.5px solid var(--line); color:var(--ink);
    font-weight:700; font-size:0.84rem; padding:10px 15px; border-radius:10px; cursor:pointer;
  }

  /* ---- Seeding (Day 1) ---- */
  .seed-slot{ border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .seed-slot .lab{ font-weight:800; font-size:0.8rem; color:var(--ink-soft); margin-bottom:8px; }

  /* ---- Celebrate ---- */
  .celebrate{ text-align:center; padding:32px 16px; }
  .celebrate .big{ font-size:2.2rem; margin-bottom:6px; }
  .celebrate h2{ font-family:'Lora',serif; font-weight:700; margin:0 0 8px; }
  .celebrate p{ color:var(--ink-soft); font-size:0.9rem; margin:0 0 18px; }

  /* ---- Archive ---- */
  .filter-row{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-row button{
    flex:1; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    font-weight:700; font-size:0.82rem; padding:9px; border-radius:10px; cursor:pointer;
  }
  .filter-row button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .arc-entry{
    display:flex; gap:12px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:12px; padding:12px; margin-bottom:10px;
  }
  .arc-entry img{ width:64px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0; background:var(--line); }
  .arc-entry .meta{ flex:1; min-width:0; }
  .arc-entry .word{ font-family:'Lora',serif; font-weight:700; font-size:1.05rem; }
  .arc-entry .day{ font-size:0.74rem; color:var(--ink-soft); font-weight:700; }
  .arc-entry .standout{ font-size:0.82rem; margin-top:4px; }
  .arc-entry audio{ width:100%; margin-top:6px; height:30px; }

  /* ---- Progress ---- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; }
  .stat .num{ font-family:'Lora',serif; font-size:1.5rem; font-weight:700; }
  .stat .lab{ font-size:0.7rem; color:var(--ink-soft); font-weight:700; }
  .today-dots{ display:flex; gap:8px; margin-bottom:20px; }
  .today-dots .pill{ flex:1; text-align:center; padding:10px; border-radius:10px; font-size:0.78rem; font-weight:800; background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft); }
  .today-dots .pill.done{ background:var(--gold); color:var(--navy-deep); border-color:var(--gold); }

  footer{ text-align:center; color:var(--ink-soft); font-size:0.75rem; margin:10px 20px 0; }
  footer button.reset-link{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:0.75rem; font-family:'Inter',sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ribbon">
    <p class="est">Your thesaurus · est. today</p>
    <div class="row">
      <div>
        <h1>Word Thread</h1>
        <p class="sub">Day <span id="hdrDay">1</span></p>
      </div>
      <div class="streak">🔥 <span id="hdrStreak">0</span> day streak</div>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="archive">Archive</button>
    <button data-tab="progress">Progress</button>
  </nav>

  <div class="content">
    <div id="view-today" class="view active"></div>
    <div id="view-archive" class="view"></div>
    <div id="view-progress" class="view"></div>
  </div>

  <footer>
    Redirects go to the real Merriam-Webster Thesaurus — this app only tracks your threads, captures, and streak.
    <br><button class="reset-link" id="resetBtn">reset all data</button>
  </footer>
</div>

<script>
/* =========================================================
   BACKUP WORD POOL — used only for "surprise me" when nothing
   stood out to you. Not scraped from M-W; a plain personal
   fallback list. Every word here has a normal M-W thesaurus
   entry as of this build.
   ========================================================= */
const BACKUP_WORDS = [
  'vivid','steady','earnest','bold','keen','ample','brisk','frank','lucid','robust',
  'subtle','tender','vast','wary','zealous','ardent','candor','clarity','deft','eager',
  'fierce','grace','humble','inspire','judicious','lively','mellow','noble','odd','placid',
  'quaint','rally','sincere','tenacious','urgent','valiant','witty','yearn','zest','ample',
  'blunt','crisp','daring','elegant','fond','genuine','hearty','intent','jovial','kindle',
  'lavish','modest','notable','optimism','poised','quiet','radiant','sturdy','thrive','upright',
  'vibrant','warm','ambitious','brave','calm','devoted','earnest','frugal','gentle','honest',
  'insightful','jubilant','loyal','mindful','neat','open','patient','quick','reliable','sincere'
];

/* =========================================================
   STATE — localStorage holds structure + text, IndexedDB
   holds the actual photo/audio files (too big for localStorage
   once you've got 75 days of them).
   ========================================================= */
const STORE_KEY = 'wordThreadState_v1';
function freshState(){
  return {
    day: 1,
    seeded: false,
    seedDraft: ['', '', ''],
    threads: [ {word:null}, {word:null}, {word:null} ],
    doneToday: [false, false, false],
    activeThread: 0,
    history: [],            // {threadIdx, day, word, standout, photoId, audioId, timestamp}
    usedWords: [],
    completedDates: []      // calendar dates where all 3 threads were finished
  };
}
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return freshState();
}
let state = loadState();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* =========================================================
   INDEXEDDB — tiny wrapper, no library
   ========================================================= */
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject) => {
    const req = indexedDB.open('wordThreadDB', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('files', {keyPath:'id'}); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbPutBlob(id, blob){
  const db = await getDB();
  return new Promise((resolve,reject) => {
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put({id, blob});
    tx.oncomplete = () => resolve(id);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetBlob(id){
  if(!id) return null;
  const db = await getDB();
  return new Promise((resolve,reject) => {
    const tx = db.transaction('files','readonly');
    const req = tx.objectStore('files').get(id);
    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDeleteAll(){
  const db = await getDB();
  return new Promise((resolve,reject) => {
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function newId(prefix){ return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

/* =========================================================
   HELPERS
   ========================================================= */
function mwThesaurusUrl(word){ return 'https://www.merriam-webster.com/thesaurus/' + encodeURIComponent(word.trim().toLowerCase()); }
function mwDictionaryUrl(word){ return 'https://www.merriam-webster.com/dictionary/' + encodeURIComponent(word.trim().toLowerCase()); }
function mwBrowseUrl(){ return 'https://www.merriam-webster.com/browse/thesaurus/a'; }

function pickSurpriseWord(){
  const pool = BACKUP_WORDS.filter(w => !state.usedWords.includes(w));
  const list = pool.length ? pool : BACKUP_WORDS;
  return list[Math.floor(Math.random() * list.length)];
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function computeStreak(){
  if(state.completedDates.length === 0) return 0;
  const dates = [...state.completedDates].sort().reverse();
  let streak = 0;
  let cursor = new Date();
  // allow today to be "in progress" without breaking the chain from yesterday
  let d = cursor.toISOString().slice(0,10);
  if(!dates.includes(d)){ cursor.setDate(cursor.getDate()-1); d = cursor.toISOString().slice(0,10); }
  while(dates.includes(d)){
    streak++;
    cursor.setDate(cursor.getDate()-1);
    d = cursor.toISOString().slice(0,10);
  }
  return streak;
}

/* =========================================================
   TODAY VIEW
   ========================================================= */
// in-memory (not-yet-saved) capture state for the active thread
let pending = { photoBlob:null, photoUrl:null, audioBlob:null, audioUrl:null, mediaRecorder:null, chunks:[] };
function resetPending(){
  pending = { photoBlob:null, photoUrl:null, audioBlob:null, audioUrl:null, mediaRecorder:null, chunks:[] };
}

function renderToday(){
  const el = document.getElementById('view-today');

  if(!state.seeded){
    renderSeed(el);
    return;
  }

  const allDone = state.doneToday.every(Boolean);
  if(allDone){
    renderDayComplete(el);
    return;
  }

  // find the first thread not yet done today
  const idx = state.doneToday.findIndex(d => !d);
  state.activeThread = idx;
  const thread = state.threads[idx];

  const dots = state.threads.map((t,i) => {
    let cls = 'dot';
    if(state.doneToday[i]) cls += ' done';
    else if(i === idx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div class="thread-progress">${dots}</div>
      <p class="eyebrow">Day ${state.day} · thread ${idx+1} of 3</p>
      <div class="thread-tag">Thread ${idx+1}</div>
      <h2 class="headword">${thread.word}</h2>
      <a class="mw-link" href="${mwThesaurusUrl(thread.word)}" target="_blank" rel="noopener">Read on Merriam-Webster ↗</a>
      <div style="margin:-10px 0 20px;"><a href="${mwDictionaryUrl(thread.word)}" target="_blank" rel="noopener" style="font-size:0.78rem; color:var(--ink-soft);">No thesaurus entry? Try the dictionary page →</a></div>

      <p class="step-label">Photo of what you wrote</p>
      <div class="file-row">
        <label class="upload-btn">📷 Upload photo<input type="file" id="photoInput" accept="image/*" capture="environment"></label>
        <img id="photoThumb" class="thumb" style="display:none;">
        <span class="file-ok" id="photoOk"></span>
      </div>

      <p class="step-label">Say it out loud</p>
      <div class="rec-controls">
        <button class="rec" id="recBtn" type="button">● Record</button>
        <label class="upload-btn" style="padding:9px 12px;">Or upload audio<input type="file" id="audioInput" accept="audio/*"></label>
        <audio id="audioPreview" controls style="display:none;"></audio>
      </div>

      <p class="step-label">What word or phrase stood out to you? (not "${thread.word}" itself)</p>
      <div class="standout-row">
        <input type="text" id="standoutInput" placeholder="Type it here...">
        <button class="surprise" id="surpriseBtn" type="button">🎲 Surprise me</button>
      </div>

      <div class="step-actions">
        <span></span>
        <button class="primary" id="saveEntryBtn" disabled>Save & continue</button>
      </div>
    </div>`;

  resetPending();
  wireCaptureHandlers(thread);
}

function wireCaptureHandlers(thread){
  const photoInput = document.getElementById('photoInput');
  const photoThumb = document.getElementById('photoThumb');
  const photoOk = document.getElementById('photoOk');
  const audioInput = document.getElementById('audioInput');
  const audioPreview = document.getElementById('audioPreview');
  const recBtn = document.getElementById('recBtn');
  const standoutInput = document.getElementById('standoutInput');
  const surpriseBtn = document.getElementById('surpriseBtn');
  const saveBtn = document.getElementById('saveEntryBtn');

  function checkReady(){
    saveBtn.disabled = !(pending.photoBlob && pending.audioBlob && standoutInput.value.trim().length > 0);
  }

  photoInput.onchange = () => {
    const f = photoInput.files[0];
    if(!f) return;
    pending.photoBlob = f;
    pending.photoUrl = URL.createObjectURL(f);
    photoThumb.src = pending.photoUrl;
    photoThumb.style.display = 'inline-block';
    photoOk.textContent = f.name;
    checkReady();
  };

  audioInput.onchange = () => {
    const f = audioInput.files[0];
    if(!f) return;
    pending.audioBlob = f;
    pending.audioUrl = URL.createObjectURL(f);
    audioPreview.src = pending.audioUrl;
    audioPreview.style.display = 'inline-block';
    checkReady();
  };

  recBtn.onclick = async () => {
    if(recBtn.classList.contains('stop')){
      pending.mediaRecorder.stop();
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      alert('In-browser recording needs a secure (https) connection — use "Or upload audio" instead, or record with your phone and upload the file.');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      pending.chunks = [];
      mr.ondataavailable = e => pending.chunks.push(e.data);
      mr.onstop = () => {
        const blob = new Blob(pending.chunks, {type:'audio/webm'});
        pending.audioBlob = blob;
        pending.audioUrl = URL.createObjectURL(blob);
        audioPreview.src = pending.audioUrl;
        audioPreview.style.display = 'inline-block';
        stream.getTracks().forEach(t => t.stop());
        recBtn.textContent = '● Record';
        recBtn.classList.remove('stop');
        checkReady();
      };
      pending.mediaRecorder = mr;
      mr.start();
      recBtn.textContent = '■ Stop';
      recBtn.classList.add('stop');
    }catch(e){
      alert('Mic access was blocked or unavailable. Use "Or upload audio" instead.');
    }
  };

  standoutInput.oninput = checkReady;
  surpriseBtn.onclick = () => { standoutInput.value = pickSurpriseWord(); checkReady(); };

  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    const photoId = newId('photo');
    const audioId = newId('audio');
    await idbPutBlob(photoId, pending.photoBlob);
    await idbPutBlob(audioId, pending.audioBlob);

    const standout = standoutInput.value.trim();
    const idx = state.activeThread;
    state.history.push({
      threadIdx: idx, day: state.day, word: thread.word,
      standout, photoId, audioId, timestamp: new Date().toISOString()
    });
    state.usedWords.push(thread.word.toLowerCase());
    state.doneToday[idx] = true;
    state.threads[idx].word = standout; // becomes tomorrow's word for this thread
    save();
    renderToday();
  };
}

function renderSeed(el){
  const drafts = state.seedDraft;
  el.innerHTML = `
    <div class="card">
      <p class="eyebrow">Day 1 · choose your 3 words</p>
      <h2 class="headword" style="font-size:1.5rem;">Start your threads</h2>
      <p style="color:var(--ink-soft); font-size:0.9rem; margin:0 0 16px;">Browse the real Merriam-Webster Thesaurus and pick whatever catches your eye — three words, one per thread.</p>
      <a class="mw-link" href="${mwBrowseUrl()}" target="_blank" rel="noopener">Browse Merriam-Webster Thesaurus ↗</a>

      ${[0,1,2].map(i => `
        <div class="seed-slot">
          <p class="lab">Thread ${i+1} word</p>
          <input type="text" class="seedInput" data-i="${i}" value="${drafts[i]||''}" placeholder="e.g. adore">
        </div>`).join('')}

      <div class="step-actions">
        <span></span>
        <button class="primary" id="startDay1Btn">Start Day 1</button>
      </div>
    </div>`;

  el.querySelectorAll('.seedInput').forEach(inp => {
    inp.oninput = () => { state.seedDraft[+inp.dataset.i] = inp.value; save(); };
  });
  document.getElementById('startDay1Btn').onclick = () => {
    const words = state.seedDraft.map(w => w.trim());
    if(words.some(w => !w)){ alert('Type all 3 words to start.'); return; }
    words.forEach((w,i) => state.threads[i].word = w);
    state.seeded = true;
    save();
    renderToday();
  };
}

function renderDayComplete(el){
  el.innerHTML = `
    <div class="card celebrate">
      <div class="big">📖</div>
      <h2>Day ${state.day} — all 3 threads done</h2>
      <p>Whatever stood out today is already queued as tomorrow's words. Come back tomorrow to keep the threads going.</p>
      <button class="primary" id="advanceBtn">Continue to Day ${state.day+1}</button>
    </div>`;
  document.getElementById('advanceBtn').onclick = () => {
    const today = todayStr();
    if(!state.completedDates.includes(today)) state.completedDates.push(today);
    state.day += 1;
    state.doneToday = [false,false,false];
    save();
    renderToday();
  };
}

/* =========================================================
   ARCHIVE VIEW
   ========================================================= */
let archiveFilter = 'all';
function renderArchive(){
  const el = document.getElementById('view-archive');
  const entries = [...state.history].sort((a,b) => b.day - a.day || b.threadIdx - a.threadIdx);
  const shown = archiveFilter === 'all' ? entries : entries.filter(e => e.threadIdx === +archiveFilter);

  el.innerHTML = `
    <div class="filter-row">
      <button data-f="all" class="${archiveFilter==='all'?'active':''}">All</button>
      <button data-f="0" class="${archiveFilter==='0'?'active':''}">Thread 1</button>
      <button data-f="1" class="${archiveFilter==='1'?'active':''}">Thread 2</button>
      <button data-f="2" class="${archiveFilter==='2'?'active':''}">Thread 3</button>
    </div>
    <div id="arcList">${shown.length ? '' : '<p style="color:var(--ink-soft); font-size:0.9rem;">Nothing archived yet.</p>'}</div>`;

  el.querySelectorAll('.filter-row button').forEach(b => {
    b.onclick = () => { archiveFilter = b.dataset.f; renderArchive(); };
  });

  const list = document.getElementById('arcList');
  shown.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'arc-entry';
    row.innerHTML = `
      <img id="img-${entry.photoId}">
      <div class="meta">
        <div class="word">${entry.word}</div>
        <div class="day">Day ${entry.day} · Thread ${entry.threadIdx+1}</div>
        <div class="standout">Stood out: <b>${entry.standout}</b></div>
        <audio id="aud-${entry.audioId}" controls></audio>
      </div>`;
    list.appendChild(row);
    idbGetBlob(entry.photoId).then(blob => { if(blob) row.querySelector('img').src = URL.createObjectURL(blob); });
    idbGetBlob(entry.audioId).then(blob => { if(blob) row.querySelector('audio').src = URL.createObjectURL(blob); });
  });
}

/* =========================================================
   PROGRESS VIEW
   ========================================================= */
function renderProgress(){
  const el = document.getElementById('view-progress');
  const streak = computeStreak();
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${state.history.length}</div><div class="lab">entries saved</div></div>
      <div class="stat"><div class="num">${state.completedDates.length}</div><div class="lab">days finished</div></div>
      <div class="stat"><div class="num">${streak}</div><div class="lab">day streak</div></div>
    </div>
    <p class="step-label" style="margin-top:0;">Today's threads</p>
    <div class="today-dots">
      ${state.doneToday.map((d,i) => `<div class="pill ${d?'done':''}">Thread ${i+1}${d?' ✓':''}</div>`).join('')}
    </div>
    <p class="step-label">Current words in play</p>
    ${state.threads.map((t,i) => `<div class="arc-entry" style="align-items:center;"><div class="meta"><div class="word">${t.word || '—'}</div><div class="day">Thread ${i+1}</div></div></div>`).join('')}
  `;
}

/* =========================================================
   NAV + INIT
   ========================================================= */
function switchTab(tab){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='today') renderToday();
  if(tab==='archive') renderArchive();
  if(tab==='progress') renderProgress();
}
document.querySelectorAll('nav.tabs button').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });

document.getElementById('resetBtn').onclick = async () => {
  if(confirm('Reset all data? This deletes every saved photo, recording, and your streak — permanently.')){
    localStorage.removeItem(STORE_KEY);
    await idbDeleteAll();
    state = freshState();
    updateHeader();
    switchTab('today');
  }
};

function updateHeader(){
  document.getElementById('hdrDay').textContent = state.day;
  document.getElementById('hdrStreak').textContent = computeStreak();
}

updateHeader();
renderToday();
setInterval(updateHeader, 5000);
</script>
</body>
</html>
